<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Empresa de Comidas</title>
    <style>
        /* Reseteo básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fondo temático de comida */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Imagen de fondo de comida (pizza/hamburguesa) con un tinte oscuro para que el texto resalte */
            background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.65); /* Capa oscura semitransparente */
            z-index: 1;
        }

        /* Contenedor principal (Tarjeta de Login) */
        .login-container {
            position: relative;
            z-index: 2;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Icono de la marca */
        .logo-icon {
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 26px;
            font-weight: 700;
        }

        /* Estilos para los campos de texto */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        /* Efecto al seleccionar el input */
        .input-group input:focus {
            outline: none;
            border-color: #e65100; /* Naranja fuerte */
            box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.2);
        }

        /* Estilos del botón */
        button {
            width: 100%;
            padding: 15px;
            background-color: #ff6f00; /* Color apetitoso */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #e65100;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Mensaje de resultado / error */
        #resultado {
            margin-top: 15px;
            color: #d93025; /* Rojo para error por defecto */
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }
    </style>
</head>
<body>
    
    <!-- Interfaz Gráfica -->
    <div class="login-container">
        <div class="logo-icon">🍔</div>
        <h1>SISTEMA DELIVERY 🍔🍔🍔🍔🍔</h1>
        
        <div class="input-group">
            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" placeholder="ejemplo@correo.com">
        </div>
        
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña">
        </div>
        
        <button onclick="iniciarSesion()">Iniciar Sesión</button>
        <p id="resultado"></p>
    </div>

    <!-- Script de Firebase (Lógica Original) -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        
        const firebaseConfig = {
            // PEGA TU CONFIGURACIÓN DE FIREBASE AQUÍ
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Funcion para iniciar sesion
        window.iniciarSesion = async function(){
            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;
            const resultado = document.getElementById("resultado");
            
            // Limpiar el mensaje antes de intentar
            resultado.innerText = "";
            resultado.style.color = "#d93025"; // Rojo por defecto para errores

            // Validar campos vacíos rápidamente
            if (!correo || !password) {
                resultado.innerText = "Por favor, completa ambos campos.";
                return;
            }

            try {
                // Modificando texto del botón para feedback visual
                const btn = document.querySelector('button');
                btn.innerText = "Cargando...";

                const usuario = await signInWithEmailAndPassword(
                    auth,
                    correo,
                    password
                );
                
                console.log("Usuario autentificado...");
                
                // Éxito: Mensaje verde y redirección
                resultado.style.color = "#0f9d58"; 
                resultado.innerText = "¡Bienvenido! Redirigiendo...";
                btn.innerText = "Iniciar Sesión";

                // Retraso de 1 segundo para que el usuario vea el mensaje de éxito
                setTimeout(() => {
                    window.location.href = "/chat";
                }, 1000);

            } catch(error){
                console.error(error);
                document.querySelector('button').innerText = "Iniciar Sesión";
                resultado.innerText = "Correo o contraseña incorrectos";
            }
        };
    </script>
</body>
</html>
